<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINALE DEDALO v2.0 — SERVER PERCY JACKSON</title>
  <style>
    :root {
      --green: #00ff41;
      --dim-green: #00aa2a;
      --dark: #0d0d0d;
      --panel: #0a1a0a;
      --border: #003311;
      --red: #ff3333;
      --gold: #ffd700;
      --cyan: #00ffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    #header {
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      flex-shrink: 0;
    }
    #header .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--green);
      text-shadow: 0 0 8px var(--green);
      letter-spacing: 2px;
    }
    #status-bar { display: flex; gap: 20px; font-size: 12px; }
    .status-item { display: flex; gap: 6px; align-items: center; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      animation: blink 1.5s infinite;
    }
    .status-dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #terminal {
      flex: 1; overflow-y: auto;
      padding: 16px 20px; scroll-behavior: smooth;
    }
    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: var(--dark); }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .line { margin-bottom: 4px; line-height: 1.5; word-break: break-all; }
    .line.cmd     { color: var(--cyan); }
    .line.info    { color: var(--dim-green); }
    .line.error   { color: var(--red); }
    .line.success { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
    .line.system  { color: #888; font-style: italic; }
    .line.secret  { color: #cc88ff; }
    .line.ascii   { color: var(--green); white-space: pre; font-size: 12px; line-height: 1.2; }

    #input-area {
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); flex-shrink: 0;
    }
    #prompt-label {
      color: var(--dim-green); white-space: nowrap;
      text-shadow: 0 0 4px var(--dim-green);
    }
    #cmd-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--cyan);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px; caret-color: var(--green);
    }

    #unlock-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      justify-content: center; align-items: center;
      flex-direction: column; gap: 20px;
    }
    #unlock-overlay.show { display: flex; }
    #unlock-overlay .trophy { font-size: 64px; animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    #unlock-overlay .prize-text {
      color: var(--gold); font-size: 24px;
      text-shadow: 0 0 20px var(--gold);
      text-align: center; letter-spacing: 2px;
    }
    #unlock-overlay .sub { color: var(--green); font-size: 14px; text-align: center; }
    #unlock-overlay button {
      margin-top: 10px; background: var(--border);
      color: var(--green); border: 1px solid var(--green);
      padding: 8px 24px; font-family: 'Courier New', monospace;
      font-size: 14px; cursor: pointer; letter-spacing: 1px;
    }
    #unlock-overlay button:hover { background: var(--dim-green); color: var(--dark); }
  </style>
</head>
<body>

<div id="header">
  <div class="title">⚡ TERMINALE DEDALO v2.0</div>
  <div id="status-bar">
    <div class="status-item">
      <div class="status-dot" id="server-dot"></div>
      <span id="server-status-label">SERVER: —</span>
    </div>
    <div class="status-item">
      <div class="status-dot red" id="hack-dot"></div>
      <span id="hack-label">SISTEMA: BLOCCATO</span>
    </div>
    <div class="status-item">
      <span id="tentativi-label">TENTATIVI: —</span>
    </div>
  </div>
</div>

<div id="terminal"></div>

<div id="input-area">
  <span id="prompt-label">dedalo@labirinto:~$</span>
  <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="digita un comando..." />
</div>

<div id="unlock-overlay">
  <div class="trophy">🏺</div>
  <div class="prize-text" id="prize-text"></div>
  <div class="sub">Il sistema è sbloccato. Usa <strong>cat [nomefile]</strong> per leggere i file segreti.</div>
  <button onclick="document.getElementById('unlock-overlay').classList.remove('show')">[ CONTINUA ]</button>
</div>

<script>
  const RAW_URL = "https://raw.githubusercontent.com/Giuspo-exe/server-percy-jackson/main/controllo.json";

  const LS_KEY = 'dedalo_tentativi';
  const MASTER_RESET_HASH = 'eef557c8d2be0744e03becf0215bbf82f71801308e5d89e3598ac45a2fa58e8c'; // password: 9911

  let stato = {
    sbloccato: false,
    tentativi: null,
    dati: null,
    fileSegreti: null,
    premioFinale: null
  };

  /* ── Stato server ── */
  function isOffline() { return stato.dati && stato.dati.status_server !== 'online'; }
  function bloccatoOffline() {
    print('[ERRORE] Connessione rifiutata dal remote host. Terminale in sola lettura.', 'error');
  }

  /* ── LocalStorage helpers ── */
  function leggiTentativi()        { const v = localStorage.getItem(LS_KEY); return v !== null ? parseInt(v) : null; }
  function salvaTentativi(n)       { localStorage.setItem(LS_KEY, n); }
  function cancellaLocalStorage()  { localStorage.removeItem(LS_KEY); }

  const term = document.getElementById('terminal');
  const input = document.getElementById('cmd-input');

  /* ── Utility output ── */
  function print(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    term.appendChild(d);
    term.scrollTop = term.scrollHeight;
  }

  /* ── Crypto helpers (AES-256-CBC, stessa logica del server PowerShell) ── */
  async function sha256Bytes(text) {
    return new Uint8Array(
      await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
    );
  }

  async function sha256Hex(text) {
    const buf = await sha256Bytes(text);
    return Array.from(buf).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function aesDecrypt(base64cipher, password, ivSeed) {
    const keyBytes  = await sha256Bytes(password);               // 32 byte
    const ivFull    = await sha256Bytes(ivSeed);
    const iv        = ivFull.slice(0, 16);                       // 16 byte

    const key = await crypto.subtle.importKey(
      'raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']
    );

    const cipherBytes = Uint8Array.from(atob(base64cipher), c => c.charCodeAt(0));
    const plainBuf    = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, cipherBytes);
    return new TextDecoder().decode(plainBuf);
  }

  /* ── UI ── */
  function aggiornaUI() {
    if (!stato.dati) return;
    const dot = document.getElementById('server-dot');
    const lbl = document.getElementById('server-status-label');
    if (stato.dati.status_server === 'online') {
      dot.classList.remove('red');
      lbl.textContent = 'SERVER: ONLINE';
    } else {
      dot.classList.add('red');
      lbl.textContent = 'SERVER: OFFLINE';
    }
    document.getElementById('tentativi-label').textContent = `TENTATIVI: ${stato.tentativi}`;
    if (stato.sbloccato) {
      document.getElementById('hack-dot').classList.remove('red');
      document.getElementById('hack-label').textContent = 'SISTEMA: SBLOCCATO';
    }
  }

  /* ── Intestazione ASCII ── */
  function stampaIntestazione() {
    const ascii = [
      "  ____  _____  ___  ____  __    __  _  _  ____",
      " (  _ \\( ___ )(  _)(  _ \\(  )  /__\\( \\/ )/ ___)",
      "  )(_) ))   /  )_)  )(_) ))(__/(__)\\\\  / \\___ \\",
      " (____/(_)\\_)(___)(____/(____(__)(__)\\/ (____/",
      "",
      "   ──── LABIRINTO DI DEDALO — SISTEMA PROTETTO ────"
    ];
    ascii.forEach(l => {
      const d = document.createElement('div');
      d.className = 'line ascii';
      d.textContent = l;
      term.appendChild(d);
    });
    term.scrollTop = term.scrollHeight;
  }

  function stampaInfoBoot() {
    print('');
    if (stato.dati) {
      print('[OK]   Connesso al server remoto.', 'info');
      print(`[INFO] STATUS SERVER: ${stato.dati.status_server.toUpperCase()}`, 'info');
      print(`[INFO] Contenuti sensibili: CIFRATI (AES-256)`, 'info');
      print(`[INFO] Tentativi disponibili: ${stato.tentativi}`, 'info');
      if (stato.sbloccato) print('[INFO] Sistema: SBLOCCATO', 'success');
    } else {
      print('[WARN] Nessun dato remoto. Usa  reload  per connetterti.', 'error');
    }
    print('');
    print('Digita  help  per vedere i comandi disponibili.', 'system');
    print('');
  }

  /* ── Boot ── */
  async function boot() {
    stampaIntestazione();
    print('');
    print('[BOOT] Inizializzazione sistema...', 'system');
    print('[BOOT] Connessione al server remoto...', 'system');
    await new Promise(r => setTimeout(r, 800));

    try {
      const res = await fetch(RAW_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      stato.dati = await res.json();
      // LocalStorage ha priorità sul valore remoto
      const salvati = leggiTentativi();
      stato.tentativi = salvati !== null ? salvati : stato.dati.tentativi_disponibili;
      print('[OK]   Dati ricevuti da GitHub.', 'info');
      print(`[INFO] STATUS SERVER: ${stato.dati.status_server.toUpperCase()}`, 'info');
      print(`[INFO] Contenuti sensibili: CIFRATI (AES-256)`, 'info');
      if (salvati !== null) {
        print(`[INFO] Tentativi rimasti (da sessione precedente): ${stato.tentativi}`, stato.tentativi > 0 ? 'info' : 'error');
      } else {
        print(`[INFO] Tentativi disponibili: ${stato.tentativi}`, 'info');
      }
      if (isOffline()) {
        print('', '');
        print('██ [CRITICAL ERROR] ████████████████████████████████████████████', 'error');
        print('   CONNESSIONE AL SERVER SOSPESA DA REMOTO. SISTEMA INACCESSIBILE.', 'error');
        print('   Usa  reload  per riprovare quando il server torna online.', 'error');
        print('████████████████████████████████████████████████████████████████', 'error');
      } else if (stato.tentativi <= 0) {
        print('', '');
        print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
        print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
        print('███████████████████████████████████████', 'error');
      }
      aggiornaUI();
    } catch(e) {
      print('[ERR]  Impossibile raggiungere il server remoto.', 'error');
      print('[ERR]  ' + e.message, 'error');
    }

    print('');
    print('Digita  help  per vedere i comandi disponibili.', 'system');
    print('');
    input.focus();
  }

  /* ── Comandi ── */
  const COMANDI = {
    help() {
      print('');
      print('══════════════ COMANDI DISPONIBILI ══════════════', 'info');
      print('  help              — mostra questo messaggio', 'info');
      print('  status            — stato del server remoto', 'info');
      print('  hack [codice]     — tenta di sbloccare il sistema', 'info');
      print('  cat [nomefile]    — leggi un file segreto (solo dopo sblocco)', 'info');
      print('  ls                — lista file segreti (solo dopo sblocco)', 'info');
      print('  reload            — ricarica dati da GitHub', 'info');
      print('  clear             — pulisci terminale', 'info');
      print('═════════════════════════════════════════════════', 'info');
      print('');
    },

    async status() {
      if (!stato.dati) { print('[ERR] Nessun dato. Usa reload.', 'error'); return; }
      print('');
      print('── STATUS SERVER ──────────────────────────────', 'info');
      print(`  server   : ${stato.dati.status_server}`, 'info');
      print(`  tema     : ${stato.dati.tema_grafico}`, 'info');
      print(`  tentativi: ${stato.tentativi}`, 'info');
      print(`  sblocco  : ${stato.sbloccato ? 'SI' : 'NO'}`, stato.sbloccato ? 'success' : 'error');
      print(`  dati enc : ${stato.sbloccato ? 'DECIFRATI' : 'CIFRATI'}`, stato.sbloccato ? 'success' : 'error');
      print('───────────────────────────────────────────────', 'info');
      print('');
    },

    async hack(args) {
      if (!stato.dati) { print('[ERR] Nessun dato remoto. Usa reload prima.', 'error'); return; }
      if (isOffline()) { bloccatoOffline(); return; }
      if (stato.sbloccato) { print('[OK] Sistema già sbloccato.', 'success'); return; }
      const codice = args[0];
      if (!codice) { print('[ERR] Uso: hack [codice]', 'error'); return; }
      if (stato.tentativi <= 0) {
        print('', '');
        print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
        print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
        print('███████████████████████████████████████', 'error');
        return;
      }

      print(`[HACK] Elaborazione codice "${codice}"...`, 'system');
      await new Promise(r => setTimeout(r, 600));
      const hash = await sha256Hex(codice);
      print(`[HASH] ${hash}`, 'system');
      await new Promise(r => setTimeout(r, 400));

      if (hash !== stato.dati.codice_segreto_hash) {
        stato.tentativi--;
        salvaTentativi(stato.tentativi);
        print(`[FAIL] Codice errato. Tentativi rimasti: ${stato.tentativi}`, 'error');
        if (stato.tentativi <= 0) {
          print('', '');
          print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
          print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
          print('███████████████████████████████████████', 'error');
        }
        aggiornaUI();
        return;
      }

      // Codice corretto → decifro i dati segreti
      print('[DECRYPT] Decifratura dati in corso...', 'system');
      await new Promise(r => setTimeout(r, 500));
      try {
        const premioPlain   = await aesDecrypt(stato.dati.premio_finale_enc,  codice, 'iv_premio');
        const segretiPlain  = await aesDecrypt(stato.dati.file_segreti_enc,   codice, 'iv_segreti');
        stato.premioFinale  = premioPlain;
        stato.fileSegreti   = JSON.parse(segretiPlain);
      } catch(e) {
        print('[ERR] Errore durante la decifratura: ' + e.message, 'error');
        return;
      }

      stato.sbloccato = true;
      print('');
      print('████ ACCESSO CONCESSO ████', 'success');
      print(`Premio: ${stato.premioFinale}`, 'success');
      print('Usa  ls  per vedere i file segreti, poi  cat [nome]  per leggerli.', 'success');
      print('');
      aggiornaUI();
      document.getElementById('prize-text').textContent = '🏆 ' + stato.premioFinale;
      document.getElementById('unlock-overlay').classList.add('show');
    },

    ls() {
      if (isOffline()) { bloccatoOffline(); return; }
      if (!stato.sbloccato) { print('[ERR] Sistema bloccato. Usa hack prima.', 'error'); return; }
      print('');
      print('── FILE SEGRETI ──────────────────────────────', 'secret');
      stato.fileSegreti.forEach(f => print(`  📄 ${f.nome}`, 'secret'));
      print('──────────────────────────────────────────────', 'secret');
      print('');
    },

    cat(args) {
      if (isOffline()) { bloccatoOffline(); return; }
      if (!stato.sbloccato) { print('[ERR] Sistema bloccato. Usa hack prima.', 'error'); return; }
      const nome = args.join(' ');
      if (!nome) { print('[ERR] Uso: cat [nomefile]', 'error'); return; }
      const file = stato.fileSegreti.find(f => f.nome === nome);
      if (!file) { print(`[ERR] File non trovato: ${nome}`, 'error'); return; }
      print('');
      print(`── ${file.nome} ${'─'.repeat(Math.max(0, 44 - file.nome.length))}`, 'secret');
      print('  ' + file.contenuto, 'secret');
      print('─'.repeat(46), 'secret');
      print('');
    },

    async reload() {
      print('[INFO] Ricarico dati da GitHub...', 'system');
      stato.sbloccato = false;
      stato.fileSegreti = null;
      stato.premioFinale = null;
      try {
        const res = await fetch(RAW_URL + '?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        stato.dati = await res.json();
        // LocalStorage comanda sempre — il JSON dà solo il valore iniziale assoluto
        const salvati = leggiTentativi();
        stato.tentativi = salvati !== null ? salvati : stato.dati.tentativi_disponibili;
        if (isOffline()) {
          print('', '');
          print('██ [CRITICAL ERROR] ████████████████████████████████████████████', 'error');
          print('   CONNESSIONE AL SERVER SOSPESA DA REMOTO. SISTEMA INACCESSIBILE.', 'error');
          print('   Riprova con  reload  quando il server torna online.', 'error');
          print('████████████████████████████████████████████████████████████████', 'error');
        } else {
          print('[OK] Dati aggiornati. Server online.', 'success');
        }
        aggiornaUI();
      } catch(e) {
        print('[ERR] ' + e.message, 'error');
      }
    },

    clear() {
      term.innerHTML = '';
      stampaIntestazione();
      stampaInfoBoot();
    },

    async master_reset(args) {
      const pwd = args[0];
      if (!pwd) { print('[ERR] Uso: master_reset [codice]', 'error'); return; }
      const hash = await sha256Hex(pwd);
      if (hash !== MASTER_RESET_HASH) {
        print('[ERR] Codice di ripristino non valido.', 'error');
        return;
      }
      cancellaLocalStorage();
      stato.tentativi = stato.dati ? stato.dati.tentativi_disponibili : 10;
      stato.sbloccato = false;
      stato.fileSegreti = null;
      stato.premioFinale = null;
      aggiornaUI();
      print('');
      print('[MASTER] LocalStorage cancellato. Tentativi ripristinati.', 'success');
      print(`[MASTER] Tentativi disponibili: ${stato.tentativi}`, 'success');
      print('');
    }
  };

  /* ── Input handler ── */
  input.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const raw = input.value.trim();
    input.value = '';
    if (!raw) return;
    print(`dedalo@labirinto:~$ ${raw}`, 'cmd');
    const parts = raw.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);
    if (COMANDI[cmd]) await COMANDI[cmd](args);
    else print(`[ERR] Comando sconosciuto: "${cmd}". Digita help.`, 'error');
  });

  boot();
</script>
</body>
</html>
