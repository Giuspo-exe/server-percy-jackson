<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINALE DEDALO v2.0 — SERVER PERCY JACKSON</title>
  <style>
    :root {
      --green: #00ff41;
      --dim-green: #00aa2a;
      --dark: #0d0d0d;
      --panel: #0a1a0a;
      --border: #003311;
      --red: #ff3333;
      --gold: #ffd700;
      --cyan: #00ffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    #header {
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      flex-shrink: 0;
    }
    #header .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--green);
      text-shadow: 0 0 8px var(--green);
      letter-spacing: 2px;
    }
    #status-bar { display: flex; gap: 20px; font-size: 12px; align-items: center; }
    .status-item { display: flex; gap: 6px; align-items: center; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      animation: blink 1.5s infinite;
    }
    .status-dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #monete-label {
      color: var(--gold);
      text-shadow: 0 0 6px var(--gold);
      letter-spacing: 1px;
    }

    #terminal {
      flex: 1; overflow-y: auto;
      padding: 16px 20px; scroll-behavior: smooth;
    }
    #terminal::-webkit-scrollbar { width: 6px; }
    #terminal::-webkit-scrollbar-track { background: var(--dark); }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .line { margin-bottom: 4px; line-height: 1.5; word-break: break-all; }
    .line.cmd     { color: var(--cyan); }
    .line.info    { color: var(--dim-green); }
    .line.error   { color: var(--red); }
    .line.success { color: var(--gold); text-shadow: 0 0 8px var(--gold); }
    .line.system  { color: #888; font-style: italic; }
    .line.secret  { color: #cc88ff; }
    .line.ascii   { color: var(--green); white-space: pre; font-size: 12px; line-height: 1.2; }

    #input-area {
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); flex-shrink: 0;
    }
    #prompt-label {
      color: var(--dim-green); white-space: nowrap;
      text-shadow: 0 0 4px var(--dim-green);
    }
    #cmd-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--cyan);
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px; caret-color: var(--green);
    }

    #unlock-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      justify-content: center; align-items: center;
      flex-direction: column; gap: 20px;
    }
    #unlock-overlay.show { display: flex; }
    #unlock-overlay .trophy { font-size: 64px; animation: float 2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    #unlock-overlay .prize-text {
      color: var(--gold); font-size: 24px;
      text-shadow: 0 0 20px var(--gold);
      text-align: center; letter-spacing: 2px;
    }
    #unlock-overlay .sub { color: var(--green); font-size: 14px; text-align: center; }
    #unlock-overlay button {
      margin-top: 10px; background: var(--border);
      color: var(--green); border: 1px solid var(--green);
      padding: 8px 24px; font-family: 'Courier New', monospace;
      font-size: 14px; cursor: pointer; letter-spacing: 1px;
    }
    #unlock-overlay button:hover { background: var(--dim-green); color: var(--dark); }
  </style>
</head>
<body>

<div id="header">
  <div class="title">⚡ TERMINALE DEDALO v2.0</div>
  <div id="status-bar">
    <div class="status-item">
      <div class="status-dot" id="server-dot"></div>
      <span id="server-status-label">SERVER: —</span>
    </div>
    <div class="status-item">
      <div class="status-dot red" id="hack-dot"></div>
      <span id="hack-label">SISTEMA: BLOCCATO</span>
    </div>
    <div class="status-item">
      <span id="tentativi-label">TENTATIVI: —</span>
    </div>
    <div class="status-item">
      <span id="monete-label">DRACME: 0 🪙</span>
    </div>
  </div>
</div>

<div id="terminal"></div>

<div id="input-area">
  <span id="prompt-label">dedalo@labirinto:~$</span>
  <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="digita un comando..." />
</div>

<div id="unlock-overlay">
  <div class="trophy">🏺</div>
  <div class="prize-text" id="prize-text"></div>
  <div class="sub">Il sistema è sbloccato. Usa <strong>cat [nomefile]</strong> per leggere i file segreti.</div>
  <button onclick="document.getElementById('unlock-overlay').classList.remove('show')">[ CONTINUA ]</button>
</div>

<script>
  const RAW_URL = "https://raw.githubusercontent.com/Giuspo-exe/server-percy-jackson/main/controllo.json";

  /* ── Chiavi LocalStorage ── */
  const LS_KEY        = 'dedalo_tentativi';
  const LS_MONETE     = 'dedalo_monete';
  const LS_SFIDE      = 'dedalo_sfide_risolte';
  const LS_INVENTARIO = 'dedalo_inventario';

  const MASTER_RESET_HASH = 'eef557c8d2be0744e03becf0215bbf82f71801308e5d89e3598ac45a2fa58e8c'; // password: 9911

  /* ── Catalogo di fallback: usato quando il server è irraggiungibile ──
     Garantisce che diary/shop/quests/inventory non crashino offline.
     I campi enc sono vuoti: hack resta bloccato da isOffline() = true. ── */
  const DATI_DEFAULT = {
    codice_segreto_hash: "bc7d72722b512a249ff1bf5930b80f14690d79d6b2c2df9313db43b879ec3116",
    status_server: "offline",
    tema_grafico: "standard",
    tentativi_disponibili: 10,
    file_segreti_enc: "",
    premio_finale_enc: "",
    diario_sfide: [
      {
        id: "1",
        titolo: "I Ponti di Creta",
        enigma: "Ci sono 3 isole vicine nel mio laghetto privato. Ogni isola ha esattamente 3 ponti che la collegano alle altre o alla terraferma. Se un semideo parte dalla terraferma e attraversa i ponti senza mai ripassare due volte sullo stesso identico ponte, qual è il numero MASSIMO di ponti che può attraversare in totale prima di rimanere bloccato?",
        soluzione_hash: "4b43b0aee35624cd95b910189b3dc231d74c4157af082306121257341ea29011",
        ricompensa: 30
      }
    ],
    negozio_invenzioni: [
      {
        id: "bussola_icarus",
        nome: "Bussola Geometrica di Icaro",
        costo: 30,
        descrizione: "Uno strumento in ottone e bronzo che non punta al Nord magnetico, ma rileva le anomalie di navigazione magica all'interno delle griglie di gioco."
      },
      {
        id: "ingranaggio_perdice",
        nome: "Ingranaggio Perpetuo di Perdice",
        costo: 50,
        descrizione: "Un piccolo congegno meccanico che si muove di moto perpetuo. Sembra emettere una debole frequenza radio-magica legata a vecchi archivi perduti."
      }
    ],
    linee_quest: [
      {
        id: "quest_icaro_01",
        titolo: "Frequenze Labirintiche",
        requisito_item: "bussola_icarus",
        descrizione: "Sbloccando la Bussola di Icaro, l'ago inizia a girare all'impazzata, stabilizzandosi su un vettore magico anomalo. Una firma energetica sconosciuta si sta muovendo nei sotterranei del Campo...",
        premio_gdr: "[SBLOCCATO: Fornisci al Master il codice d'attivazione 'VECTOR-ICARUS' per avviare l'evento speciale in chat!]"
      }
    ]
  };

  let stato = {
    sbloccato: false,
    tentativi: null,
    dati: DATI_DEFAULT,   // fallback locale: mai null, mai sovrascrive il progresso utente
    fileSegreti: null,
    premioFinale: null
  };

  /* ── Stato server ── */
  function isOffline() { return stato.dati && stato.dati.status_server !== 'online'; }
  function bloccatoOffline() {
    print('[ERRORE] Connessione rifiutata dal remote host. Terminale in sola lettura.', 'error');
  }

  /* ── LocalStorage: tentativi (esistente) ── */
  function leggiTentativi()       { const v = localStorage.getItem(LS_KEY); return v !== null ? parseInt(v) : null; }
  function salvaTentativi(n)      { localStorage.setItem(LS_KEY, n); }
  function cancellaLocalStorage() { localStorage.removeItem(LS_KEY); }

  /* ── LocalStorage: monete ── */
  function leggiMonete() { return parseInt(localStorage.getItem(LS_MONETE) || '0'); }
  function salvaMonete(n) { localStorage.setItem(LS_MONETE, String(n)); }

  /* ── LocalStorage: sfide risolte ── */
  function leggiSfide() {
    try { return JSON.parse(localStorage.getItem(LS_SFIDE) || '[]'); } catch { return []; }
  }
  function salvaSfide(arr) { localStorage.setItem(LS_SFIDE, JSON.stringify(arr)); }

  /* ── LocalStorage: inventario ── */
  function leggiInventario() {
    try { return JSON.parse(localStorage.getItem(LS_INVENTARIO) || '[]'); } catch { return []; }
  }
  function salvaInventario(arr) { localStorage.setItem(LS_INVENTARIO, JSON.stringify(arr)); }

  /* ── Inizializzazione persistenza (non sovrascrive mai i valori esistenti) ── */
  function inizializzaPersistenza() {
    if (localStorage.getItem(LS_MONETE) === null)     salvaMonete(0);
    if (localStorage.getItem(LS_SFIDE) === null)      salvaSfide([]);
    if (localStorage.getItem(LS_INVENTARIO) === null) salvaInventario([]);
  }

  const term  = document.getElementById('terminal');
  const input = document.getElementById('cmd-input');

  /* ── Utility output ── */
  function print(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    term.appendChild(d);
    term.scrollTop = term.scrollHeight;
  }

  /* ── Crypto helpers (AES-256-CBC) ── */
  async function sha256Bytes(text) {
    return new Uint8Array(
      await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
    );
  }

  async function sha256Hex(text) {
    const buf = await sha256Bytes(text);
    return Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function aesDecrypt(base64cipher, password, ivSeed) {
    const keyBytes = await sha256Bytes(password);
    const ivFull   = await sha256Bytes(ivSeed);
    const iv       = ivFull.slice(0, 16);

    const key = await crypto.subtle.importKey(
      'raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']
    );

    const cipherBytes = Uint8Array.from(atob(base64cipher), c => c.charCodeAt(0));
    const plainBuf    = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, cipherBytes);
    return new TextDecoder().decode(plainBuf);
  }

  /* ── UI ── */
  function aggiornaUI() {
    // Monete: sempre aggiornate, indipendentemente dallo stato del server
    document.getElementById('monete-label').textContent = `DRACME: ${leggiMonete()} 🪙`;

    if (!stato.dati) return;

    const dot = document.getElementById('server-dot');
    const lbl = document.getElementById('server-status-label');
    if (stato.dati.status_server === 'online') {
      dot.classList.remove('red');
      lbl.textContent = 'SERVER: ONLINE';
    } else {
      dot.classList.add('red');
      lbl.textContent = 'SERVER: OFFLINE';
    }
    document.getElementById('tentativi-label').textContent = `TENTATIVI: ${stato.tentativi}`;
    if (stato.sbloccato) {
      document.getElementById('hack-dot').classList.remove('red');
      document.getElementById('hack-label').textContent = 'SISTEMA: SBLOCCATO';
    }
  }

  /* ── Intestazione ASCII ── */
  function stampaIntestazione() {
    const ascii = [
      "  ____  _____  ___  ____  __    __  _  _  ____",
      " (  _ \\( ___ )(  _)(  _ \\(  )  /__\\( \\/ )/ ___)",
      "  )(_) ))   /  )_)  )(_) ))(__/(__)\\\\  / \\___ \\",
      " (____/(_)\\_)(___)(____/(____(__)(__)\\/ (____/",
      "",
      "   ──── LABIRINTO DI DEDALO — SISTEMA PROTETTO ────"
    ];
    ascii.forEach(l => {
      const d = document.createElement('div');
      d.className = 'line ascii';
      d.textContent = l;
      term.appendChild(d);
    });
    term.scrollTop = term.scrollHeight;
  }

  function stampaInfoBoot() {
    print('');
    if (stato.dati) {
      print('[OK]   Connesso al server remoto.', 'info');
      print(`[INFO] STATUS SERVER: ${stato.dati.status_server.toUpperCase()}`, 'info');
      print(`[INFO] Contenuti sensibili: CIFRATI (AES-256)`, 'info');
      print(`[INFO] Tentativi disponibili: ${stato.tentativi}`, 'info');
      if (stato.sbloccato) print('[INFO] Sistema: SBLOCCATO', 'success');
    } else {
      print('[WARN] Nessun dato remoto. Usa  reload  per connetterti.', 'error');
    }
    print('');
    print('╔══════════════════════════════════════════════════╗', 'secret');
    print('║       == DISPOSITIVO DI SICUREZZA DEDALO ==      ║', 'secret');
    print('╠══════════════════════════════════════════════════╣', 'secret');
    print('║  Risolvi la quartina per trovare la chiave       ║', 'secret');
    print('║  numerica a 4 cifre:                             ║', 'secret');
    print('║                                                  ║', 'secret');
    print('║  - Due fuggitivi sfidarono il calore del sole    ║', 'secret');
    print('║    con ali di cera.                              ║', 'secret');
    print('║  - Tre sono le Ore che vegliano sui cancelli     ║', 'secret');
    print('║    dell\'Olimpo.                                  ║', 'secret');
    print('║  - Sei i primi dèi che il tempo inghiottì prima  ║', 'secret');
    print('║    della caduta dei Titani.                      ║', 'secret');
    print('║  - Uno solo è l\'occhio del fabbro che strappa    ║', 'secret');
    print('║    il fulmine alla folgore.                      ║', 'secret');
    print('║                                                  ║', 'secret');
    print('║  Unisci le risposte nell\'ordine della profezia   ║', 'secret');
    print('║  e digita:  hack [codice]                        ║', 'secret');
    print('╚══════════════════════════════════════════════════╝', 'secret');
    print('');
    print('Digita  help  per vedere i comandi disponibili.', 'system');
    print('');
  }

  /* ── Boot ── */
  async function boot() {
    inizializzaPersistenza();
    aggiornaUI(); // mostra subito le monete salvate
    stampaIntestazione();
    print('');
    print('[BOOT] Inizializzazione sistema...', 'system');
    print('[BOOT] Connessione al server remoto...', 'system');
    await new Promise(r => setTimeout(r, 800));

    try {
      const res = await fetch(RAW_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      stato.dati = await res.json();
      // LocalStorage ha sempre priorità — il JSON dà solo il valore iniziale assoluto
      const salvati = leggiTentativi();
      stato.tentativi = salvati !== null ? salvati : stato.dati.tentativi_disponibili;
      print('[OK]   Dati ricevuti da GitHub.', 'info');
      print(`[INFO] STATUS SERVER: ${stato.dati.status_server.toUpperCase()}`, 'info');
      print(`[INFO] Contenuti sensibili: CIFRATI (AES-256)`, 'info');
      if (salvati !== null) {
        print(`[INFO] Tentativi rimasti (da sessione precedente): ${stato.tentativi}`, stato.tentativi > 0 ? 'info' : 'error');
      } else {
        print(`[INFO] Tentativi disponibili: ${stato.tentativi}`, 'info');
      }
      if (isOffline()) {
        print('', '');
        print('██ [CRITICAL ERROR] ████████████████████████████████████████████', 'error');
        print('   CONNESSIONE AL SERVER SOSPESA DA REMOTO. SISTEMA INACCESSIBILE.', 'error');
        print('   Usa  reload  per riprovare quando il server torna online.', 'error');
        print('████████████████████████████████████████████████████████████████', 'error');
      } else if (stato.tentativi <= 0) {
        print('', '');
        print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
        print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
        print('███████████████████████████████████████', 'error');
      }
      aggiornaUI();
    } catch(e) {
      print('[ERR]  Impossibile raggiungere il server remoto.', 'error');
      print('[ERR]  ' + e.message, 'error');
      print('[WARN] Catalogo locale di fallback attivato. Diary/Shop/Quests disponibili.', 'system');
      // stato.dati è già DATI_DEFAULT: catalogo sempre accessibile
      const salvati = leggiTentativi();
      stato.tentativi = salvati !== null ? salvati : stato.dati.tentativi_disponibili;
      aggiornaUI();
    }

    print('');
    print('Digita  help  per vedere i comandi disponibili.', 'system');
    print('');
    input.focus();
  }

  /* ══════════════════════════════════════════════════════════════
     DIZIONARIO COMANDI
  ══════════════════════════════════════════════════════════════ */
  const COMANDI = {

    /* ── help ─────────────────────────────────────────────────── */
    help() {
      print('');
      print('══════════════ COMANDI DISPONIBILI ══════════════', 'info');
      print('  help              — mostra questo messaggio', 'info');
      print('  status            — stato del server remoto', 'info');
      print('  hack [codice]     — tenta di sbloccare il sistema', 'info');
      print('  cat [nomefile]    — leggi un file segreto (solo dopo sblocco)', 'info');
      print('  ls                — lista file segreti (solo dopo sblocco)', 'info');
      print('  reload            — ricarica dati da GitHub', 'info');
      print('  clear             — pulisci terminale', 'info');
      print('  inventory         — mostra le tue monete e gli oggetti acquistati', 'info');
      print('  diary [args]      — accedi al diario delle sfide di Dedalo', 'info');
      print('  shop [args]       — accedi al mercato automatizzato delle invenzioni', 'info');
      print('  quests            — mostra l\'archivio delle linee di missioni attive', 'info');
      print('═════════════════════════════════════════════════', 'info');
      print('');
    },

    /* ── status ───────────────────────────────────────────────── */
    async status() {
      if (!stato.dati) { print('[ERR] Nessun dato. Usa reload.', 'error'); return; }
      print('');
      print('── STATUS SERVER ──────────────────────────────', 'info');
      print(`  server   : ${stato.dati.status_server}`, 'info');
      print(`  tema     : ${stato.dati.tema_grafico}`, 'info');
      print(`  tentativi: ${stato.tentativi}`, 'info');
      print(`  sblocco  : ${stato.sbloccato ? 'SI' : 'NO'}`, stato.sbloccato ? 'success' : 'error');
      print(`  dati enc : ${stato.sbloccato ? 'DECIFRATI' : 'CIFRATI'}`, stato.sbloccato ? 'success' : 'error');
      print('───────────────────────────────────────────────', 'info');
      print('');
    },

    /* ── hack ─────────────────────────────────────────────────── */
    async hack(args) {
      if (!stato.dati) { print('[ERR] Nessun dato remoto. Usa reload prima.', 'error'); return; }
      if (isOffline()) { bloccatoOffline(); return; }
      if (stato.sbloccato) { print('[OK] Sistema già sbloccato.', 'success'); return; }
      const codice = args[0];
      if (!codice) { print('[ERR] Uso: hack [codice]', 'error'); return; }
      if (stato.tentativi <= 0) {
        print('', '');
        print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
        print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
        print('███████████████████████████████████████', 'error');
        return;
      }

      print(`[HACK] Elaborazione codice "${codice}"...`, 'system');
      await new Promise(r => setTimeout(r, 600));
      const hash = await sha256Hex(codice);
      print(`[HASH] ${hash}`, 'system');
      await new Promise(r => setTimeout(r, 400));

      if (hash !== stato.dati.codice_segreto_hash) {
        stato.tentativi--;
        salvaTentativi(stato.tentativi);
        print(`[FAIL] Codice errato. Tentativi rimasti: ${stato.tentativi}`, 'error');
        if (stato.tentativi <= 0) {
          print('', '');
          print('██████████ HARDWARE LOCKDOWN ██████████', 'error');
          print('Tentativi esauriti. Contattare il Master per un codice di ripristino.', 'error');
          print('███████████████████████████████████████', 'error');
        }
        aggiornaUI();
        return;
      }

      print('[DECRYPT] Decifratura dati in corso...', 'system');
      await new Promise(r => setTimeout(r, 500));
      try {
        const premioPlain  = await aesDecrypt(stato.dati.premio_finale_enc, codice, 'iv_premio');
        const segretiPlain = await aesDecrypt(stato.dati.file_segreti_enc,  codice, 'iv_segreti');
        stato.premioFinale = premioPlain;
        stato.fileSegreti  = JSON.parse(segretiPlain);
      } catch(e) {
        print('[ERR] Errore durante la decifratura: ' + e.message, 'error');
        return;
      }

      stato.sbloccato = true;
      print('');
      print('████ ACCESSO CONCESSO ████', 'success');
      print(`Premio: ${stato.premioFinale}`, 'success');
      print('Usa  ls  per vedere i file segreti, poi  cat [nome]  per leggerli.', 'success');
      print('');
      aggiornaUI();
      document.getElementById('prize-text').textContent = '🏆 ' + stato.premioFinale;
      document.getElementById('unlock-overlay').classList.add('show');
    },

    /* ── ls ───────────────────────────────────────────────────── */
    ls() {
      if (isOffline()) { bloccatoOffline(); return; }
      if (!stato.sbloccato) { print('[ERR] Sistema bloccato. Usa hack prima.', 'error'); return; }
      print('');
      print('── FILE SEGRETI ──────────────────────────────', 'secret');
      stato.fileSegreti.forEach(f => print(`  📄 ${f.nome}`, 'secret'));
      print('──────────────────────────────────────────────', 'secret');
      print('');
    },

    /* ── cat ──────────────────────────────────────────────────── */
    cat(args) {
      if (isOffline()) { bloccatoOffline(); return; }
      if (!stato.sbloccato) { print('[ERR] Sistema bloccato. Usa hack prima.', 'error'); return; }
      const nome = args.join(' ');
      if (!nome) { print('[ERR] Uso: cat [nomefile]', 'error'); return; }
      const file = stato.fileSegreti.find(f => f.nome === nome);
      if (!file) { print(`[ERR] File non trovato: ${nome}`, 'error'); return; }
      print('');
      print(`── ${file.nome} ${'─'.repeat(Math.max(0, 44 - file.nome.length))}`, 'secret');
      print('  ' + file.contenuto, 'secret');
      print('─'.repeat(46), 'secret');
      print('');
    },

    /* ── reload ───────────────────────────────────────────────── */
    async reload() {
      print('[INFO] Ricarico dati da GitHub...', 'system');
      stato.sbloccato = false;
      stato.fileSegreti = null;
      stato.premioFinale = null;
      try {
        const res = await fetch(RAW_URL + '?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        stato.dati = await res.json();
        // LocalStorage comanda sempre — il JSON dà solo il valore iniziale assoluto
        const salvati = leggiTentativi();
        stato.tentativi = salvati !== null ? salvati : stato.dati.tentativi_disponibili;
        if (isOffline()) {
          print('', '');
          print('██ [CRITICAL ERROR] ████████████████████████████████████████████', 'error');
          print('   CONNESSIONE AL SERVER SOSPESA DA REMOTO. SISTEMA INACCESSIBILE.', 'error');
          print('   Riprova con  reload  quando il server torna online.', 'error');
          print('████████████████████████████████████████████████████████████████', 'error');
        } else {
          print('[OK] Dati aggiornati. Server online.', 'success');
        }
        aggiornaUI();
      } catch(e) {
        print('[ERR] ' + e.message, 'error');
      }
    },

    /* ── clear ────────────────────────────────────────────────── */
    clear() {
      term.innerHTML = '';
      stampaIntestazione();
      stampaInfoBoot();
    },

    /* ── master_reset ─────────────────────────────────────────── */
    async master_reset(args) {
      const pwd = args[0];
      if (!pwd) { print('[ERR] Uso: master_reset [codice]', 'error'); return; }
      const hash = await sha256Hex(pwd);
      if (hash !== MASTER_RESET_HASH) {
        print('[ERR] Codice di ripristino non valido.', 'error');
        return;
      }
      // Reset chiave tentativi
      cancellaLocalStorage();
      // Reset chiavi di progressione
      salvaMonete(0);
      salvaSfide([]);
      salvaInventario([]);
      // Reset stato in memoria
      stato.tentativi = stato.dati ? stato.dati.tentativi_disponibili : 10;
      stato.sbloccato = false;
      stato.fileSegreti = null;
      stato.premioFinale = null;
      aggiornaUI();
      print('');
      print('[MASTER] LocalStorage cancellato. Profilo giocatore azzerato.', 'success');
      print(`[MASTER] Tentativi disponibili: ${stato.tentativi}`, 'success');
      print('[MASTER] Dracme: 0 | Sfide risolte: 0 | Inventario: vuoto', 'success');
      print('');
    },

    /* ══════════════════════════════════════════════════════════
       NUOVI COMANDI — SISTEMA PROGRESSIONE INTER-SESSIONE
    ══════════════════════════════════════════════════════════ */

    /* ── inventory ────────────────────────────────────────────── */
    inventory() {
      const monete     = leggiMonete();
      const inventario = leggiInventario();
      print('');
      print('══════════════ INVENTARIO SEMIDEO ══════════════', 'info');
      print(`  💰 DRACME DI BRONZO: ${monete}`, 'success');
      print('────────────────────────────────────────────────', 'info');
      if (inventario.length === 0) {
        print('  [SISTEMA] Nessun prototipo acquisito nell\'arsenale.', 'system');
        print('  Usa  shop  per esplorare il mercato delle invenzioni.', 'system');
      } else {
        print('  PROTOTIPI ACQUISITI:', 'info');
        if (stato.dati && stato.dati.negozio_invenzioni) {
          inventario.forEach(id => {
            const item = stato.dati.negozio_invenzioni.find(i => i.id === id);
            if (item) {
              print(`  ⚙  [${item.id}] ${item.nome}`, 'secret');
              print(`      ${item.descrizione}`, 'system');
            } else {
              print(`  ⚙  [${id}] (scheda tecnica non disponibile — usa reload)`, 'system');
            }
          });
        } else {
          inventario.forEach(id => print(`  ⚙  ${id}`, 'system'));
          print('  (usa reload per caricare i dati del catalogo)', 'system');
        }
      }
      print('═════════════════════════════════════════════════', 'info');
      print('');
    },

    /* ── diary ────────────────────────────────────────────────── */
    async diary(args) {
      if (!stato.dati) { print('[ERR] Nessun dato remoto. Usa reload.', 'error'); return; }
      if (!stato.dati.diario_sfide || !Array.isArray(stato.dati.diario_sfide)) {
        print('[ERR] Archivio sfide non disponibile nel database remoto.', 'error');
        return;
      }

      const sub = args[0] ? args[0].toLowerCase() : null;

      /* ── diary (senza argomenti): catalogo sfide ── */
      if (!sub) {
        const sfideRisolte = leggiSfide();
        print('');
        print('══════════════ DIARIO DELLE SFIDE ══════════════', 'info');
        stato.dati.diario_sfide.forEach(sfida => {
          const risolto     = sfideRisolte.includes(sfida.id);
          const statoTesto  = risolto ? '[RISOLTO] ' : '[CRIPTATO]';
          const cls         = risolto ? 'success' : 'info';
          print(`  [${sfida.id}] ${sfida.titolo}  ${statoTesto}`, cls);
        });
        print('═════════════════════════════════════════════════', 'info');
        print('  diary read [id]         — leggi il testo di un enigma', 'system');
        print('  diary solve [id] [risp] — decifra la risposta', 'system');
        print('');
        return;
      }

      /* ── diary read [id] ── */
      if (sub === 'read') {
        const id = args[1];
        if (!id) { print('[ERR] Uso: diary read [id]', 'error'); return; }
        const sfida = stato.dati.diario_sfide.find(s => s.id === id);
        if (!sfida) { print(`[ERR] Sfida non trovata nel catalogo: "${id}"`, 'error'); return; }
        const sfideRisolte = leggiSfide();
        print('');
        const sep = '─'.repeat(Math.max(0, 46 - sfida.titolo.length));
        print(`── SFIDA [${sfida.id}]: ${sfida.titolo} ${sep}`, 'secret');
        print('  ' + sfida.enigma, 'secret');
        if (sfideRisolte.includes(sfida.id)) {
          print('  ⚠ [SISTEMA] Sfida già risolta. Ricompensa già riscossa.', 'system');
        }
        print('─'.repeat(50), 'secret');
        print('');
        return;
      }

      /* ── diary solve [id] [risposta] ── */
      if (sub === 'solve') {
        if (isOffline()) { bloccatoOffline(); return; }
        const id = args[1];
        if (!id) { print('[ERR] Uso: diary solve [id] [risposta]', 'error'); return; }
        const risposta = args.slice(2).join(' ').toLowerCase().trim();
        if (!risposta) { print('[ERR] Inserisci una risposta dopo l\'ID.', 'error'); return; }

        const sfida = stato.dati.diario_sfide.find(s => s.id === id);
        if (!sfida) { print(`[ERR] Sfida non trovata nel catalogo: "${id}"`, 'error'); return; }

        const sfideRisolte = leggiSfide();
        if (sfideRisolte.includes(id)) {
          print('[SISTEMA] Sfida già risolta. Ricompensa già riscossa.', 'system');
          return;
        }

        print(`[DIARY] Elaborazione risposta in corso...`, 'system');
        await new Promise(r => setTimeout(r, 500));
        const hash = await sha256Hex(risposta);

        if (hash !== sfida.soluzione_hash) {
          print('[FAIL] Decifratura fallita. Risposta errata.', 'error');
          print(`[HASH] ${hash}`, 'system');
          return;
        }

        // Risposta corretta
        sfideRisolte.push(id);
        salvaSfide(sfideRisolte);
        const moneteAttuali = leggiMonete();
        const nuoveMonete   = moneteAttuali + (sfida.ricompensa || 0);
        salvaMonete(nuoveMonete);
        aggiornaUI();

        print('');
        print('████ ENIGMA DECIFRATO ████', 'success');
        print(`  ✔ [${sfida.id}] ${sfida.titolo}`, 'success');
        print(`  ✔ Ricompensa: +${sfida.ricompensa} Dracme di Bronzo`, 'success');
        print(`  ✔ Saldo aggiornato: ${nuoveMonete} 🪙`, 'success');
        print('  Usa  shop  per spendere le tue Dracme.', 'system');
        print('');
        return;
      }

      print(`[ERR] Sotto-comando sconosciuto: "${sub}".`, 'error');
      print('  Usa: diary | diary read [id] | diary solve [id] [risposta]', 'system');
    },

    /* ── shop ─────────────────────────────────────────────────── */
    async shop(args) {
      if (!stato.dati) { print('[ERR] Nessun dato remoto. Usa reload.', 'error'); return; }
      if (!stato.dati.negozio_invenzioni || !Array.isArray(stato.dati.negozio_invenzioni)) {
        print('[ERR] Catalogo invenzioni non disponibile nel database remoto.', 'error');
        return;
      }

      const sub = args[0] ? args[0].toLowerCase() : null;

      /* ── shop (senza argomenti): bacheca catalogo ── */
      if (!sub) {
        const inventario = leggiInventario();
        const monete     = leggiMonete();
        print('');
        print('══════════════ MERCATO DELLE INVENZIONI ══════════════', 'info');
        print(`  💰 Il tuo saldo: ${monete} Dracme di Bronzo`, 'success');
        print('──────────────────────────────────────────────────────', 'info');
        stato.dati.negozio_invenzioni.forEach(item => {
          const acquistato = inventario.includes(item.id);
          print(`  [${item.id}] ${item.nome}`, 'secret');
          print(`       ${item.descrizione}`, 'system');
          if (acquistato) {
            print(`       [ACQUISTATO]`, 'success');
          } else {
            print(`       Costo: ${item.costo} Dracme  |  shop buy ${item.id}`, 'info');
          }
          print('  ·', 'system');
        });
        print('══════════════════════════════════════════════════════', 'info');
        print('');
        return;
      }

      /* ── shop buy [id_oggetto] ── */
      if (sub === 'buy') {
        if (isOffline()) { bloccatoOffline(); return; }
        const id = args[1];
        if (!id) { print('[ERR] Uso: shop buy [id_oggetto]', 'error'); return; }

        const item = stato.dati.negozio_invenzioni.find(i => i.id === id);
        if (!item) { print(`[ERR] Oggetto non trovato nel catalogo: "${id}"`, 'error'); return; }

        const inventario = leggiInventario();
        if (inventario.includes(id)) {
          print('[SISTEMA] Prototipo già presente nel tuo inventario.', 'system');
          return;
        }

        const monete = leggiMonete();
        if (monete < item.costo) {
          print(`[ERR] Dracme insufficienti. Richieste: ${item.costo} | Disponibili: ${monete}`, 'error');
          return;
        }

        const nuoveMonete = monete - item.costo;
        salvaMonete(nuoveMonete);
        inventario.push(id);
        salvaInventario(inventario);
        aggiornaUI();

        print('');
        print('████ ACQUISIZIONE COMPLETATA ████', 'success');
        print(`  ⚙  ${item.nome} aggiunto all'inventario.`, 'success');
        print(`  ✔ Costo: -${item.costo} Dracme | Saldo: ${nuoveMonete} 🪙`, 'success');
        print('  Usa  quests  per sbloccare le zone di missione.', 'system');
        print('');
        return;
      }

      print(`[ERR] Sotto-comando sconosciuto: "${sub}".`, 'error');
      print('  Usa: shop | shop buy [id_oggetto]', 'system');
    },

    /* ── quests ───────────────────────────────────────────────── */
    quests() {
      if (!stato.dati) { print('[ERR] Nessun dato remoto. Usa reload.', 'error'); return; }
      if (!stato.dati.linee_quest || !Array.isArray(stato.dati.linee_quest)) {
        print('[ERR] Archivio missioni non disponibile nel database remoto.', 'error');
        return;
      }

      const inventario = leggiInventario();
      print('');
      print('══════════════ ARCHIVIO MISSIONI ══════════════', 'info');
      stato.dati.linee_quest.forEach(quest => {
        const sbloccata = inventario.includes(quest.requisito_item);
        print(`  ▶ ${quest.titolo}`, 'secret');
        if (sbloccata) {
          print(`    STATUS: [SBLOCCATA]`, 'success');
          print(`    ${quest.descrizione}`, 'info');
          print(`    ⚡ MASTER GDR: ${quest.premio_gdr}`, 'success');
        } else {
          print(`    STATUS: [BLOCCATA]`, 'error');
          // Risolve il nome dell'oggetto per un messaggio leggibile
          let nomeItem = quest.requisito_item;
          if (stato.dati.negozio_invenzioni) {
            const item = stato.dati.negozio_invenzioni.find(i => i.id === quest.requisito_item);
            if (item) nomeItem = `${item.nome} [${quest.requisito_item}]`;
          }
          print(`    ⛔ Strumento richiesto: ${nomeItem}`, 'error');
          print(`    Acquista "${nomeItem}" nello shop per decodificare questa zona.`, 'system');
        }
        print('  ·', 'system');
      });
      print('═══════════════════════════════════════════════', 'info');
      print('');
    }

  }; // fine COMANDI

  /* ── Input handler ── */
  input.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    const raw = input.value.trim();
    input.value = '';
    if (!raw) return;
    print(`dedalo@labirinto:~$ ${raw}`, 'cmd');
    const parts = raw.split(/\s+/);
    const cmd   = parts[0].toLowerCase();
    const args  = parts.slice(1);
    if (COMANDI[cmd]) await COMANDI[cmd](args);
    else print(`[ERR] Comando sconosciuto: "${cmd}". Digita help.`, 'error');
  });

  boot();
</script>
</body>
</html>
